<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ItamarOS Web Emulator</title><style>
:root{font-family:system-ui;color:#f5f8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#366ba5,#0a1932 65%,#070c19);height:100vh;overflow:hidden}header{padding:20px}header h1{margin:0;font-size:25px}header small{color:#b8d4f4}.desktop{display:grid;grid-template-columns:repeat(2,100px);gap:16px;padding:25px}.app{border:0;background:#ffffff16;color:white;padding:15px 5px;border-radius:15px;cursor:pointer}.app:hover{background:#ffffff35}.app span{display:block;font-size:30px;margin-bottom:7px}.taskbar{position:absolute;bottom:0;background:#101c33dd;width:100%;padding:12px;display:flex;gap:10px;align-items:center;backdrop-filter:blur(15px)}button{cursor:pointer}.taskbar button,.window button{border:0;border-radius:8px;padding:8px;background:#34517b;color:white}.window{position:absolute;top:15%;left:20%;width:min(580px,78vw);min-height:240px;border:1px solid #7698c2;background:#132541;border-radius:14px;box-shadow:0 20px 80px #0008;overflow:hidden}.bar{padding:12px;background:#29456a;display:flex;justify-content:space-between}.content{padding:20px}.content textarea{width:100%;height:180px;background:#07172c;color:white;border:1px solid #789;padding:12px}.content input{width:100%;padding:10px;border-radius:8px}.content pre{white-space:pre-wrap}.hidden{display:none}.note{color:#b4c6dc;font-size:12px}.content button{margin:4px}.app{min-height:90px}.desktop{grid-template-columns:repeat(auto-fill,100px);max-width:900px}.window{max-height:72vh;overflow:auto}.content iframe{width:100%;height:45vh;border:0;background:white;border-radius:8px}.content .tile{display:inline-block;padding:10px;margin:5px;background:#29466b;border-radius:10px} #appmenu{position:absolute;bottom:62px;left:12px;width:min(420px,calc(100vw - 24px));max-height:65vh;overflow:auto;background:#152943;border:1px solid #6086b1;border-radius:16px;padding:16px;box-shadow:0 15px 45px #0009;z-index:5}#appmenu[hidden]{display:none}#appsearch{width:100%;padding:12px;border-radius:9px;background:#edf4ff;color:#112;border:0}#appresults{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}#appresults button{background:#294c76;color:white;border:0;padding:12px 5px;border-radius:9px}#searchhint{font-size:12px;color:#bdd3ef;margin-top:7px}
/* Windows-inspired desktop shell */
:root{font-family:"Segoe UI",system-ui,sans-serif;color:#f7f9ff}
body{background:radial-gradient(ellipse at 55% 72%,#7ba4e7 0%,#3167ba 22%,#174587 43%,#091b48 75%,#07112b 100%);}
body:before{content:"";position:absolute;inset:8% 15% 15% 22%;pointer-events:none;background:linear-gradient(135deg,#9acbff66,#3878e455 50%,#4da8ff20);clip-path:polygon(0 0,48% 0,48% 45%,100% 45%,100% 100%,52% 100%,52% 55%,0 55%);filter:drop-shadow(0 0 30px #78adff)}
header{padding:20px 26px}header h1{font-weight:600;font-size:21px}header small{font-size:12px}
.desktop{position:relative;display:grid;grid-template-columns:repeat(2,90px);grid-auto-rows:90px;gap:8px;padding:18px;max-width:225px;z-index:1}
.app{background:transparent;border:1px solid transparent;border-radius:7px;font-size:12px;text-shadow:0 1px 3px #0007;min-height:80px}.app:hover,.app:focus-visible{background:#ffffff25;border-color:#ffffff44}.app span{font-size:32px}
.taskbar{height:58px;justify-content:center;gap:7px;background:#dce8fae8;color:#16294c;border-top:1px solid #ffffffaa;backdrop-filter:blur(25px);z-index:8}
.taskbar button{background:transparent;color:#1c3760;border-radius:8px;font-size:13px}.taskbar button:hover{background:#ffffffa8}
.taskbar>span:last-child{display:none}
#clock{position:absolute;right:15px;font-size:13px;color:#172c4b;background:transparent;border:0;padding:8px 10px;border-radius:7px;font-variant-numeric:tabular-nums}
#clock:hover{background:#ffffffb8}
.window{top:12%;left:22%;width:min(700px,76vw);background:#f7faff;color:#152744;border:1px solid #aabbd1;border-radius:11px;z-index:4}
.bar{background:#e9f0fb;color:#132b50;padding:9px 13px}.bar button{background:#dbe5f4;color:#1c2c45}.content{color:#192b44}
.content input,.content textarea{background:white;color:#172945;border:1px solid #aabbd1}
#appmenu{background:#edf3fbeF;color:#1b2c48;backdrop-filter:blur(30px);bottom:65px;left:50%;transform:translateX(-50%);border-color:#fff9;box-shadow:0 20px 70px #0005}
#appresults button{background:#dce8f7;color:#1a3052}
#searchhint{color:#45627e}
#clockpanel{position:absolute;right:12px;bottom:65px;z-index:10;background:#edf3f9f5;color:#1b3152;border:1px solid #fff;border-radius:14px;padding:24px;box-shadow:0 20px 60px #0006;min-width:280px;backdrop-filter:blur(30px)}
#clockpanel[hidden]{display:none}#fulltime{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}#fulldate{margin-top:9px;color:#415b79}
@media(max-width:600px){.window{left:4%;width:92vw;top:12%}.taskbar{justify-content:flex-start;padding-left:8px}.taskbar button{font-size:11px;padding:7px}#clock{right:3px}}
</style>
<header><h1>◈ ItamarOS</h1><small>Web Emulator · Limited preview · Local storage</small></header><main class="desktop"><button class="app" onclick="launch('files')"><span>📁</span>Files</button><button class="app" onclick="launch('terminal')"><span>⌨️</span>Terminal</button><button class="app" onclick="launch('notes')"><span>📝</span>Notepad</button><button class="app" onclick="launch('calculator')"><span>🧮</span>Calculator</button><button class="app" onclick="launch('browser')"><span>🌐</span>Browser</button><button class="app" onclick="launch('settings')"><span>⚙️</span>Settings</button><button class="app" onclick="launch('store')"><span>🛍️</span>Store</button><button class="app" onclick="launch('calendar')"><span>📅</span>Calendar</button><button class="app" onclick="launch('clock')"><span>🕒</span>Clock</button><button class="app" onclick="launch('paint')"><span>🎨</span>Paint</button><button class="app" onclick="launch('photos')"><span>🖼️</span>Photos</button><button class="app" onclick="launch('music')"><span>🎵</span>Music</button><button class="app" onclick="launch('video')"><span>🎬</span>Videos</button><button class="app" onclick="launch('tasks')"><span>☑️</span>Tasks</button><button class="app" onclick="launch('system')"><span>📊</span>System</button><button class="app" onclick="launch('help')"><span>❔</span>Help</button></main><section id="window" class="window hidden"><div class="bar"><b id="title"></b><button onclick="closeWindow()">✕</button></div><div id="content" class="content"></div></section><section id="appmenu" hidden><h3>All apps · כל האפליקציות</h3><input id="appsearch" aria-label="Search applications" placeholder="Search apps… (Tab = smart search)" autocomplete="off"><div id="searchhint">Search by name. Press Tab to switch to smart search.</div><div id="appresults"></div></section><nav class="taskbar"><button onclick="toggleApps()">☷ All apps</button><button onclick="toggleApps(true)">🔎 Search apps</button><button onclick="launch('welcome')">◈ Start</button><button id="clock" aria-label="Show full time" aria-expanded="false" onclick="toggleClock()"></button><span style="margin-left:auto">ItamarOS 0.2 · Browser preview</span></nav><aside id="clockpanel" hidden><div id="fulltime"></div><div id="fulldate"></div><p style="font-size:12px;color:#58708c">Local time on your device</p></aside><script>
const $=id=>document.getElementById(id);const state=JSON.parse(localStorage.getItem('itamaros-data')||'{"files":{"Welcome.txt":"Welcome to ItamarOS!"},"note":""}');function save(){localStorage.setItem('itamaros-data',JSON.stringify(state))}function closeWindow(){$('window').classList.add('hidden')}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function launch(app){$('window').classList.remove('hidden');$('title').textContent=app[0].toUpperCase()+app.slice(1);let c=$('content');if(app==='notes'){c.innerHTML='<textarea id="note" placeholder="Write here..."></textarea><p class="note">Autosaved locally</p>';$('note').value=state.note;$('note').oninput=e=>{state.note=e.target.value;save()}}else if(app==='files'){c.innerHTML='<button onclick="newFile()">+ New file</button><div id="listing"></div>';files()}else if(app==='terminal'){c.innerHTML='<pre>ItamarOS Web Terminal (simulation)\nCommands: help, date, ls, clear, echo TEXT</pre><input id="cmd" placeholder="Enter command">';$('cmd').onkeydown=e=>{if(e.key==='Enter'){let cmd=e.target.value;let out=cmd==='help'?'help, date, ls, clear, echo TEXT':cmd==='date'?new Date().toString():cmd==='ls'?Object.keys(state.files).join('\n'):cmd.startsWith('echo ')?cmd.slice(5):cmd==='clear'?'':'Command not available in web preview';c.querySelector('pre').textContent=cmd==='clear'?'':c.querySelector('pre').textContent+'\n> '+cmd+'\n'+out;e.target.value=''}}}else if(app==='calculator'){c.innerHTML='<input id="expr" placeholder="Example: 12 * (4 + 2)"><button id="calc">Calculate</button><pre id="result"></pre>';$('calc').onclick=()=>{let e=$('expr').value;$('result').textContent=/^[0-9+*/(). % -]+$/.test(e)?calc(e):'Invalid expression'}}else if(app==='browser'){c.innerHTML='<p>Open websites in your real browser:</p><input id="url" placeholder="https://example.com"><button onclick="openSite()">Open</button><p class="note">External sites open in a separate browser tab.</p>'}else if(app==='store'){c.innerHTML='<h3>Itamar Store</h3><p>Preview only. Real app installation is available in the future Linux desktop build.</p>'}else if(app==='calendar'){let d=new Date();c.innerHTML='<h3>'+d.toLocaleDateString('en',{month:'long',year:'numeric'})+'</h3><p>'+d.toDateString()+'</p><input type="date">' }else if(app==='clock'){c.innerHTML='<h2 id="time"></h2><p>Local time on your device</p>';function tick(){if($('time'))$('time').textContent=new Date().toLocaleString()}tick();setInterval(tick,1000)}else if(app==='tasks'){c.innerHTML='<h3>Tasks</h3><input id="task" placeholder="New task"><button onclick="addTask()">Add</button><div id="tasklist"></div>';renderTasks()}else if(app==='paint'){c.innerHTML='<h3>Paint</h3><input type="color" id="color" value="#ffffff"><button onclick="paintClear()">Clear</button><button onclick="paintSave()">Save PNG</button><canvas id="canvas" width="450" height="260" style="width:100%;background:white;touch-action:none"></canvas>';initPaint()}else if(app==='photos'){c.innerHTML='<h3>Photos</h3><input type="file" accept="image/*" id="photo"><div id="preview"></div>';$('photo').onchange=e=>{let file=e.target.files[0];if(file){let url=URL.createObjectURL(file);$('preview').innerHTML='<img alt="Selected photo" style="max-width:100%" src="'+url+'">'}}}else if(app==='music'||app==='video'){c.innerHTML='<h3>Local '+app+'</h3><input type="file" id="media" accept="'+(app==='music'?'audio/*':'video/*')+'"><div id="player"></div>';$('media').onchange=e=>{let f=e.target.files[0];if(f){let media=document.createElement(app==='music'?'audio':'video');media.controls=true;media.style.maxWidth='100%';media.src=URL.createObjectURL(f);$('player').replaceChildren(media)}}}else if(app==='system'){c.innerHTML='<h3>System Monitor</h3><p>Browser simulation, not physical OS</p><p>CPU and RAM metrics are not accessible in this preview.</p><p>Stored files: '+Object.keys(state.files).length+'</p>'}else if(app==='help'){c.innerHTML='<h3>ItamarOS Help</h3><p>This is a limited web emulator. Notes, tasks and virtual files persist locally. WebView desktop integration is planned.</p>'}else if(app==='settings'){c.innerHTML='<h3>System</h3><p>ItamarOS Web Emulator 0.2</p><p>Data saved in this browser using localStorage.</p><button onclick="if(confirm(\'Delete browser emulator data?\')){localStorage.removeItem(\'itamaros-data\');location.reload()}">Reset local data</button>'}else{c.innerHTML='<h3>Welcome to ItamarOS!</h3><p>This is a limited browser demo, not a full operating system. Your notes and virtual files persist in this browser.</p>'}}function renderTasks(){let tasks=state.tasks||[];$('tasklist').innerHTML=tasks.map((t,i)=>'<p><button onclick="removeTask('+i+')">✓</button> '+esc(t)+'</p>').join('')}function addTask(){let t=$('task').value.trim();if(t){(state.tasks??=[]).push(t);save();renderTasks();$('task').value=''}}function removeTask(i){state.tasks.splice(i,1);save();renderTasks()}let ctx,painting=false;function initPaint(){let canvas=$('canvas');ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);function pos(e){let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}canvas.onpointerdown=e=>{painting=true;canvas.setPointerCapture(e.pointerId);let [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)};canvas.onpointermove=e=>{if(!painting)return;let [x,y]=pos(e);ctx.strokeStyle=$('color').value;ctx.lineWidth=3;ctx.lineTo(x,y);ctx.stroke()};canvas.onpointerup=()=>painting=false}function paintClear(){ctx.fillStyle='white';ctx.fillRect(0,0,450,260)}function paintSave(){let a=document.createElement('a');a.href=$('canvas').toDataURL();a.download='itamaros-paint.png';a.click()}const appNames=['Files','Terminal','Notepad','Calculator','Browser','Settings','Store'];let smart=false;function toggleApps(focus=false){let m=$('appmenu');m.hidden=focus?false:!m.hidden;if(!m.hidden){renderApps();$('appsearch').focus()}}function renderApps(){let q=$('appsearch').value.toLowerCase().trim();let aliases={files:'documents folders storage',terminal:'cmd command shell',notepad:'text editor notes',calculator:'math numbers',browser:'web internet',settings:'preferences configuration',store:'apps downloads'};let results=appNames.filter(n=>n.toLowerCase().includes(q)||(smart&&(aliases[n.toLowerCase()]||'').includes(q)));$('appresults').innerHTML='';results.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{$('appmenu').hidden=true;launch(n.toLowerCase())};$('appresults').appendChild(b)});if(!results.length)$('appresults').textContent='No matching apps'}document.addEventListener('keydown',e=>{if(e.key==='Escape')$('appmenu').hidden=true;if(e.key==='Tab'&&!$('appmenu').hidden&&document.activeElement===$('appsearch')){e.preventDefault();smart=!smart;$('searchhint').textContent=smart?'✨ Smart search: also searches app descriptions. Tab to return.':'Search by name. Press Tab to switch to smart search.';renderApps()}});document.addEventListener('input',e=>{if(e.target.id==='appsearch')renderApps()});function calc(x){try{return Function('return ('+x+')')()}catch{return 'Error'}}function openSite(){let x=$('url').value.trim();if(!/^https?:\/\//i.test(x))x='https://'+x;window.open(x,'_blank','noopener,noreferrer')}function files(){$('listing').innerHTML=Object.entries(state.files).map(([k,v])=>'<p><button data-name="'+esc(k)+'">📄 '+esc(k)+'</button></p>').join('');$('listing').querySelectorAll('button').forEach(b=>b.onclick=()=>{let name=b.dataset.name;let value=prompt('Edit '+name,state.files[name]);if(value!==null){state.files[name]=value;save()}})}function newFile(){let n=prompt('File name');if(n&&!Object.hasOwn(state.files,n)){state.files[n]='';save();files()}}function refreshClock(){let d=new Date();$('clock').textContent=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});$('fulltime').textContent=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('fulldate').textContent=d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}function toggleClock(){let p=$('clockpanel');p.hidden=!p.hidden;$('clock').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden){$('appmenu').hidden=true;refreshClock()}}setInterval(refreshClock,1000);refreshClock();launch('welcome');
</script></html>

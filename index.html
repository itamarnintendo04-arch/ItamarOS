const $=id=>document.getElementById(id);const state=JSON.parse(localStorage.getItem('itamaros-data')||'{"files":{"Welcome.txt":"Welcome to ItamarOS!"},"note":""}');function save(){localStorage.setItem('itamaros-data',JSON.stringify(state))}function closeWindow(){$('window').classList.add('hidden')}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function launch(app){$('window').classList.remove('hidden');$('title').textContent=app[0].toUpperCase()+app.slice(1);let c=$('content');if(app==='notes'){c.innerHTML='<textarea id="note" placeholder="Write here..."></textarea><p class="note">Autosaved locally</p>';$('note').value=state.note;$('note').oninput=e=>{state.note=e.target.value;save()}}else if(app==='files'){c.innerHTML='<button onclick="newFile()">+ New file</button><div id="listing"></div>';files()}else if(app==='terminal'){c.innerHTML='<pre>ItamarOS Web Terminal (simulation)\nCommands: help, date, ls, clear, echo TEXT</pre><input id="cmd" placeholder="Enter command">';$('cmd').onkeydown=e=>{if(e.key==='Enter'){let cmd=e.target.value;let out=cmd==='help'?'help, date, ls, clear, echo TEXT':cmd==='date'?new Date().toString():cmd==='ls'?Object.keys(state.files).join('\n'):cmd.startsWith('echo ')?cmd.slice(5):cmd==='clear'?'':'Command not available in web preview';c.querySelector('pre').textContent=cmd==='clear'?'':c.querySelector('pre').textContent+'\n> '+cmd+'\n'+out;e.target.value=''}}}else if(app==='calculator'){c.innerHTML='<input id="expr" placeholder="Example: 12 * (4 + 2)"><button id="calc">Calculate</button><pre id="result"></pre>';$('calc').onclick=()=>{let e=$('expr').value;$('result').textContent=/^[0-9+*/(). % -]+$/.test(e)?calc(e):'Invalid expression'}}else if(app==='browser'){c.innerHTML='<p>Open websites in your real browser:</p><input id="url" placeholder="https://example.com"><button onclick="openSite()">Open</button><p class="note">External sites open in a separate browser tab.</p>'}else if(app==='store'){c.innerHTML='<h2>🛍️ ItamarOS Store</h2><p>Discover verified app sources and suggest new Windows installers.</p><div class="toolrow"><button onclick="storeTab(\'browse\')">Browse apps</button><button onclick="storeTab(\'suggest\')">Suggest an app</button><button onclick="storeTab(\'queue\')">My suggestions</button></div><div id="storeview"></div><p class="note">Browser preview: downloads and Windows app installation are not supported. Suggestions are saved only on this device.</p>';storeTab('browse')}else if(app==='calendar'){let d=new Date();c.innerHTML='<h3>'+d.toLocaleDateString('en',{month:'long',year:'numeric'})+'</h3><p>'+d.toDateString()+'</p><input type="date">' }else if(app==='clock'){c.innerHTML='<h2 id="time"></h2><p>Local time on your device</p>';function tick(){if($('time'))$('time').textContent=new Date().toLocaleString()}tick();setInterval(tick,1000)}else if(app==='tasks'){c.innerHTML='<h3>Tasks</h3><input id="task" placeholder="New task"><button onclick="addTask()">Add</button><div id="tasklist"></div>';renderTasks()}else if(app==='paint'){c.innerHTML='<h3>Paint</h3><input type="color" id="color" value="#ffffff"><button onclick="paintClear()">Clear</button><button onclick="paintSave()">Save PNG</button><canvas id="canvas" width="450" height="260" style="width:100%;background:white;touch-action:none"></canvas>';initPaint()}else if(app==='photos'){c.innerHTML='<h3>Photos</h3><input type="file" accept="image/*" id="photo"><div id="preview"></div>';$('photo').onchange=e=>{let file=e.target.files[0];if(file){let url=URL.createObjectURL(file);$('preview').innerHTML='<img alt="Selected photo" style="max-width:100%" src="'+url+'">'}}}else if(app==='music'||app==='video'){c.innerHTML='<h3>Local '+app+'</h3><input type="file" id="media" accept="'+(app==='music'?'audio/*':'video/*')+'"><div id="player"></div>';$('media').onchange=e=>{let f=e.target.files[0];if(f){let media=document.createElement(app==='music'?'audio':'video');media.controls=true;media.style.maxWidth='100%';media.src=URL.createObjectURL(f);$('player').replaceChildren(media)}}}else if(app==='system'){c.innerHTML='<h3>System Monitor</h3><p>Browser simulation, not physical OS</p><p>CPU and RAM metrics are not accessible in this preview.</p><p>Stored files: '+Object.keys(state.files).length+'</p>'}else if(app==='help'){c.innerHTML='<h3>ItamarOS Help</h3><p>This is a limited web emulator. Notes, tasks and virtual files persist locally. WebView desktop integration is planned.</p>'}else if(app==='settings'){c.innerHTML='<h3>Settings</h3><p>ItamarOS Web Emulator 0.4.0</p><div class="ios-feature"><div class="ios-pane"><h3>Software Updates</h3><p>Check for new ItamarOS versions and built-in application updates from GitHub.</p><button onclick="window.ItamarUpdates?.openSettings()">Software Updates →</button></div></div><p>Notes and app saves are stored in this browser using localStorage.</p><button onclick="if(confirm(&quot;Delete browser emulator files and notes? This does not delete saved games.&quot;)){localStorage.removeItem('itamaros-data');location.reload()}">Reset notes and files</button>'}else{c.innerHTML='<h3>Welcome to ItamarOS!</h3><p>This is a limited browser demo, not a full operating system. Your notes and virtual files persist in this browser.</p>'}}function renderTasks(){let tasks=state.tasks||[];$('tasklist').innerHTML=tasks.map((t,i)=>'<p><button onclick="removeTask('+i+')">✓</button> '+esc(t)+'</p>').join('')}function addTask(){let t=$('task').value.trim();if(t){(state.tasks??=[]).push(t);save();renderTasks();$('task').value=''}}function removeTask(i){state.tasks.splice(i,1);save();renderTasks()}let ctx,painting=false;function initPaint(){let canvas=$('canvas');ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);function pos(e){let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}canvas.onpointerdown=e=>{painting=true;canvas.setPointerCapture(e.pointerId);let [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)};canvas.onpointermove=e=>{if(!painting)return;let [x,y]=pos(e);ctx.strokeStyle=$('color').value;ctx.lineWidth=3;ctx.lineTo(x,y);ctx.stroke()};canvas.onpointerup=()=>painting=false}function paintClear(){ctx.fillStyle='white';ctx.fillRect(0,0,450,260)}function paintSave(){let a=document.createElement('a');a.href=$('canvas').toDataURL();a.download='itamaros-paint.png';a.click()}const appNames=['Files','Terminal','Notepad','Calculator','Browser','Settings','Store','GitHub','ItamarOS Player','ItamarOS Games','Streaming',"Weather","Contacts","Journal","Converter","Password Tools","Timer","Stopwatch","Whiteboard","Bookmarks","Downloads","About","Shortcuts","Reader","Random","Colors","JSON Viewer"];let smart=false;function toggleApps(focus=false){let m=$('appmenu');m.hidden=focus?false:!m.hidden;if(!m.hidden){renderApps();$('appsearch').focus()}}function renderApps(){let q=$('appsearch').value.toLowerCase().trim();let aliases={weather:'forecast conditions',contacts:'people address book',journal:'diary daily writing',converter:'units measurement',passwords:'security generator',timer:'countdown alarm',stopwatch:'chronometer',whiteboard:'drawing sketch',bookmarks:'favorites links',downloads:'export save files',about:'version computer',shortcuts:'keyboard help',reader:'text reading',random:'dice numbers',colors:'palette hex',json:'format developer',files:'documents folders storage',terminal:'cmd command shell',notepad:'text editor notes',calculator:'math numbers',browser:'web internet',settings:'preferences configuration',store:'apps downloads',github:'repository releases installer source code git software',player:'media audio video music VLC player',games:'2048 snake memory tictactoe puzzle no install'};let results=appNames.filter(n=>n.toLowerCase().includes(q)||(smart&&(aliases[n.toLowerCase()]||'').includes(q)));$('appresults').innerHTML='';results.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{$('appmenu').hidden=true;launch({'itamaros player':'player','itamaros games':'games'}[n.toLowerCase()]||n.toLowerCase())};$('appresults').appendChild(b)});if(!results.length)$('appresults').textContent='No matching apps'}document.addEventListener('keydown',e=>{if(e.key==='Escape')$('appmenu').hidden=true;if(e.key==='Tab'&&!$('appmenu').hidden&&document.activeElement===$('appsearch')){e.preventDefault();smart=!smart;$('searchhint').textContent=smart?'✨ Smart search: also searches app descriptions. Tab to return.':'Search by name. Press Tab to switch to smart search.';renderApps()}});document.addEventListener('input',e=>{if(e.target.id==='appsearch')renderApps()});async function loadStoreCatalog(){const status=$('storestatus'),container=$('storeapps');try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);let response;try{response=await fetch('https://itamaros-store-api.onrender.com/api/apps',{signal:controller.signal})}finally{clearTimeout(timeout)}if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.apps))throw Error('Invalid catalog');status.textContent=data.apps.length+' apps from ItamarOS Store API';container.replaceChildren();for(const app of data.apps){const panel=document.createElement('div');panel.className='panel';const title=document.createElement('strong');title.textContent=app.name||'Unknown app';const publisher=document.createElement('p');publisher.textContent='Publisher: '+(app.publisher||'Unknown');panel.append(title,publisher);if(typeof app.officialWebsite==='string'&&/^https:\/\//.test(app.officialWebsite)){const link=document.createElement('a');link.href=app.officialWebsite;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Official website';panel.append(link)}const note=document.createElement('p');note.className='note';note.textContent='Catalog only · Direct EXE downloads not available yet';panel.append(note);container.append(panel)}}catch(err){status.textContent='Store API unavailable ('+err.message+'). Try again later.';const retry=document.createElement('button');retry.textContent='Retry';retry.onclick=loadStoreCatalog;container.replaceChildren(retry)}}function deviceStore(){let ua=navigator.userAgent||'',mode=document.body.dataset.device||'desktop';if(/iPhone|iPad|iPod/i.test(ua))return {name:'Apple App Store',url:'https://apps.apple.com/'};if(/SamsungBrowser/i.test(ua)&&mode!=='tv')return {name:'Google Play (Samsung Android)',url:'https://play.google.com/store/apps'};if(/Android/i.test(ua))return {name:'Google Play',url:'https://play.google.com/store/apps'};if(/Tizen|SMART-TV|Samsung.*TV/i.test(ua))return {name:'Samsung TV Apps (support)',url:'https://www.samsung.com/support/tv-audio-video/'};if(/Web0S|WebOS|LG.*TV/i.test(ua))return {name:'LG Content Store',url:'https://us.lgappstv.com/'};return {name:'Choose a device store',url:null}}function storeTab(tab){let el=$('storeview');if(!el)return;if(tab==='browse'){el.innerHTML='<h3>ItamarOS App Catalog</h3><div id="devicestore"></div><p id="storestatus">Connecting to Store API…</p><div id="storeapps"></div>';let store=deviceStore(),d=$('devicestore');let note=document.createElement('p');note.textContent='Detected store: '+store.name+'. Browser detection may be inaccurate. The native ItamarOS installation system is not available in this preview.';d.append(note);if(store.url){let a=document.createElement('a');a.href=store.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open '+store.name;d.append(a)}let choose=document.createElement('select');choose.setAttribute('aria-label','Choose app store');[['','Choose another store'],['https://apps.apple.com/','Apple App Store'],['https://play.google.com/store/apps','Google Play'],['https://us.lgappstv.com/','LG TV Store'],['https://www.samsung.com/support/tv-audio-video/','Samsung TV support']].forEach(([url,name])=>{let o=document.createElement('option');o.value=url;o.textContent=name;choose.append(o)});choose.onchange=()=>{if(choose.value)window.open(choose.value,'_blank','noopener,noreferrer')};d.append(document.createElement('br'),choose);loadStoreCatalog()}else if(tab==='suggest'){el.innerHTML='<h3>Suggest an app</h3><p>Enter an official developer page. Do not submit unknown EXE files.</p><input id="suggestname" maxlength="100" placeholder="App name"><input id="suggesturl" maxlength="500" placeholder="https://official-developer-site.example"><button onclick="submitSuggestion()">Save suggestion</button><p id="suggeststatus"></p>'}else{let suggestions=JSON.parse(localStorage.getItem('itamaros-store-suggestions')||'[]');el.innerHTML='<h3>Suggestions saved on this device</h3>';for(let s of suggestions){let p=document.createElement('p');p.className='panel';p.textContent=s.name+' — '+s.url+' (not reviewed)';el.append(p)}if(!suggestions.length)el.append('No suggestions yet.')}}function submitSuggestion(){let name=$('suggestname').value.trim(),url=$('suggesturl').value.trim();let valid=false;try{let u=new URL(url);valid=u.protocol==='https:'}catch{}if(!name||!valid){$('suggeststatus').textContent='Enter a name and a valid HTTPS developer URL.';return}let arr=JSON.parse(localStorage.getItem('itamaros-store-suggestions')||'[]');if(arr.some(s=>s.url===url)){$('suggeststatus').textContent='Already suggested on this device.';return}arr.push({name,url});localStorage.setItem('itamaros-store-suggestions',JSON.stringify(arr));$('suggeststatus').textContent='Saved locally. Not submitted to a server or published.'}function calc(x){try{return Function('return ('+x+')')()}catch{return 'Error'}}function openSite(){let x=$('url').value.trim();if(!/^https?:\/\//i.test(x))x='https://'+x;window.open(x,'_blank','noopener,noreferrer')}function files(){$('listing').innerHTML=Object.entries(state.files).map(([k,v])=>'<p><button data-name="'+esc(k)+'">📄 '+esc(k)+'</button></p>').join('');$('listing').querySelectorAll('button').forEach(b=>b.onclick=()=>{let name=b.dataset.name;let value=prompt('Edit '+name,state.files[name]);if(value!==null){state.files[name]=value;save()}})}function newFile(){let n=prompt('File name');if(n&&!Object.hasOwn(state.files,n)){state.files[n]='';save();files()}}function detectDevice(){const ua=navigator.userAgent||'';const w=window.innerWidth;const touch=navigator.maxTouchPoints>0;if(/SmartTV|Tizen|Web0S|WebOS|HbbTV|Android TV|GoogleTV|AFT[A-Z0-9]+/i.test(ua))return 'tv';if(/iPad|Tablet|PlayBook|Silk/i.test(ua)||(/Macintosh/i.test(ua)&&touch)||(/Android/i.test(ua)&&!/Mobile/i.test(ua)))return 'tablet';if(/iPhone|iPod|Android.*Mobile|Mobile/i.test(ua))return 'mobile';if(touch&&w>=650&&w<=1366)return 'tablet';if(touch&&w<650)return 'mobile';return 'desktop'}function setDevice(device){if(!['desktop','mobile','tablet','tv'].includes(device))return;document.body.dataset.device=device;localStorage.setItem('itamaros-device-mode',device);$('device-select').value=device;if(device!=='desktop')$('window').classList.remove('maximized')}const savedDevice=localStorage.getItem('itamaros-device-mode');setDevice(['desktop','mobile','tablet','tv'].includes(savedDevice)?savedDevice:detectDevice());function refreshClock(){let d=new Date();$('clock').textContent=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});$('fulltime').textContent=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('fulldate').textContent=d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}function toggleClock(){let p=$('clockpanel');p.hidden=!p.hidden;$('clock').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden){$('appmenu').hidden=true;refreshClock()}}setInterval(refreshClock,1000);refreshClock();launch('welcome');

<script>
/* Extended desktop apps: all data stays on this browser. */
const baseLaunch=launch;
const extraLabels={player:'ItamarOS Player',games:'ItamarOS Games',github:'GitHub · ItamarOS',streaming:'Streaming',weather:'Weather',contacts:'Contacts',journal:'Journal',converter:'Converter',passwords:'Password Tools',timer:'Timer',stopwatch:'Stopwatch',whiteboard:'Whiteboard',bookmarks:'Bookmarks',downloads:'Downloads',about:'About',shortcuts:'Shortcuts',reader:'Reader',random:'Random',colors:'Colors',json:'JSON Viewer'};
let countdown=null,stopwatchStart=0,stopwatchElapsed=0,stopwatchInterval=null;
function minimizeWindow(){$('window').classList.add('hidden')}

function getStore(key,fallback){try{return JSON.parse(localStorage.getItem('itamaros-'+key))??fallback}catch{return fallback}}

function savedText(key){let e=document.getElementById('savedtext');if(e)putStore(key,e.value)}
function renderContacts(){let arr=getStore('contacts',[]);$('items').innerHTML='';arr.forEach((v,i)=>{let d=document.createElement('p');d.textContent=v.name+' — '+v.info+' ';let b=document.createElement('button');b.textContent='Delete';b.onclick=()=>{arr.splice(i,1);putStore('contacts',arr);renderContacts()};d.append(b);$('items').append(d)})}
function addContact(){let n=$('name').value.trim(),v=$('info').value.trim();if(!n)return;let a=getStore('contacts',[]);a.push({name:n,info:v});putStore('contacts',a);$('name').value='';$('info').value='';renderContacts()}
function renderBookmarks(){let arr=getStore('bookmarks',[]);$('items').innerHTML='';arr.forEach((u,i)=>{let p=document.createElement('p');let a=document.createElement('a');a.textContent=u;a.href=u;a.target='_blank';a.rel='noopener noreferrer';let b=document.createElement('button');b.textContent='✕';b.onclick=()=>{arr.splice(i,1);putStore('bookmarks',arr);renderBookmarks()};p.append(a,' ',b);$('items').append(p)})}
function addBookmark(){let u=$('link').value.trim();try{let x=new URL(u);if(!['http:','https:'].includes(x.protocol))return}catch{return}let a=getStore('bookmarks',[]);a.push(u);putStore('bookmarks',a);$('link').value='';renderBookmarks()}
function exportData(){let data={files:state.files,note:state.note,tasks:state.tasks||[],contacts:getStore('contacts',[]),journal:getStore('journal',''),bookmarks:getStore('bookmarks',[])};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='itamaros-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function updateTimer(){let e=$('countdown');if(!e){clearInterval(countdown);countdown=null;return}let s=Math.max(0,Math.ceil((window.timerEnd-Date.now())/1000));e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s){clearInterval(countdown);countdown=null;e.textContent='Time is up!'}}
function startTimer(){let n=Number($('seconds').value);if(!Number.isFinite(n)||n<=0||n>86400)return;clearInterval(countdown);window.timerEnd=Date.now()+n*1000;updateTimer();countdown=setInterval(updateTimer,250)}
function stopwatchUpdate(){let e=$('elapsed');if(e)e.textContent=((stopwatchElapsed+(stopwatchStart?Date.now()-stopwatchStart:0))/1000).toFixed(1)+' s'}
function stopwatchToggle(){if(stopwatchStart){stopwatchElapsed+=Date.now()-stopwatchStart;stopwatchStart=0;clearInterval(stopwatchInterval)}else{stopwatchStart=Date.now();stopwatchInterval=setInterval(stopwatchUpdate,100)}stopwatchUpdate()}
function stopwatchReset(){stopwatchStart=0;stopwatchElapsed=0;clearInterval(stopwatchInterval);stopwatchUpdate()}
function convertUnits(){let v=Number($('unitval').value),type=$('unit').value;let factor={km_mi:0.621371,mi_km:1.609344,kg_lb:2.2046226,lb_kg:0.45359237,cm_in:0.3937008,in_cm:2.54};$('conversion').textContent=Number.isFinite(v)?(v*factor[type]).toFixed(4):'Invalid number'}
function generatePassword(){let alphabet='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';let bytes=new Uint32Array(18);crypto.getRandomValues(bytes);$('password').value=Array.from(bytes,x=>alphabet[x%alphabet.length]).join('')}

function showJson(){try{$('jsonout').textContent=JSON.stringify(JSON.parse($('jsonin').value),null,2)}catch(e){$('jsonout').textContent='Invalid JSON: '+e.message}}
function updateColor(){$('hex').textContent=$('colorpick').value;$('swatch').style.background=$('colorpick').value}
function initWhiteboard(){let c=$('board'),ctx=c.getContext('2d'),draw=false;ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{draw=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))};c.onpointermove=e=>{if(!draw)return;ctx.strokeStyle=$('ink').value;ctx.lineWidth=4;ctx.lineCap='round';ctx.lineTo(...point(e));ctx.stroke()};c.onpointerup=()=>draw=false;$('clearboard').onclick=()=>{ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height)};$('saveboard').onclick=()=>{let a=document.createElement('a');a.href=c.toDataURL();a.download='whiteboard.png';a.click()}}

// Repository viewer uses GitHub public APIs; GitHub authorization is never requested.
const itamarGitHubRepo='itamarnintendo04-arch/ItamarOS';
function githubLink(parent,text,url,allowedPrefix){
  if(typeof url!=='string'||!url.startsWith(allowedPrefix))return;
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=text;parent.append(a);
}
async function githubTab(tab,path=''){
  const root=$('githubview');if(!root)return;root.replaceChildren();
  const status=document.createElement('p');status.className='github-status';status.textContent='Loading '+(tab==='files'?'repository files':'releases')+'…';root.append(status);
  const endpoint=tab==='releases'
    ?'https://api.github.com/repos/'+itamarGitHubRepo+'/releases'
    :'https://api.github.com/repos/'+itamarGitHubRepo+'/contents/'+path;
  try{
    const response=await fetch(endpoint,{headers:{Accept:'application/vnd.github+json'}});
    if(!response.ok)throw Error('GitHub API: HTTP '+response.status);
    const rows=await response.json();
    if(!Array.isArray(rows))throw Error('Unexpected GitHub response');
    if(!$('githubview')||root!==$('githubview'))return;
    root.replaceChildren();
    if(tab==='files'){
      const note=document.createElement('p');note.className='github-status';
      note.textContent=path?'Folder: '+path:'Repository files on main · open source and preview pages';
      root.append(note);
      if(path){const back=document.createElement('button');back.textContent='← Back';back.onclick=()=>githubTab('files',path.includes('/')?path.split('/').slice(0,-1).join('/'):'');root.append(back)}
      if(!rows.length){const p=document.createElement('p');p.textContent='This folder is empty.';root.append(p);return}
      for(const entry of rows){
        const item=document.createElement('div');item.className='github-item';
        const info=document.createElement('span');
        if(entry.type==='dir'){const button=document.createElement('button');button.textContent='📁 '+entry.name;button.onclick=()=>githubTab('files',entry.path);info.append(button)}
        else githubLink(info,'📄 '+entry.name,entry.html_url,'https://github.com/'+itamarGitHubRepo+'/');
        item.append(info);root.append(item);
      }
    }else{
      if(!rows.length){const empty=document.createElement('p');empty.className='github-status';empty.textContent='No GitHub Releases have been published. There are no real installer files to download yet.';root.append(empty);return}
      for(const release of rows){
        const section=document.createElement('div');section.className='panel';
        const heading=document.createElement('h3');heading.textContent=release.name||release.tag_name||'Release';section.append(heading);
        const assets=Array.isArray(release.assets)?release.assets:[];
        if(!assets.length){const p=document.createElement('p');p.textContent='No installer assets attached to this release.';section.append(p)}
        for(const asset of assets){
          const line=document.createElement('div');line.className='github-item';
          const megabytes=(asset.size/1024/1024).toFixed(2);
          githubLink(line,'⬇️ '+asset.name+' ('+megabytes+' MB)',asset.browser_download_url,'https://github.com/'+itamarGitHubRepo+'/releases/download/');
          if(line.childNodes.length)section.append(line);
        }
        const source=document.createElement('p');
        githubLink(source,'View release details',release.html_url,'https://github.com/'+itamarGitHubRepo+'/releases/');
        section.append(source);root.append(section);
      }
    }
  }catch(err){
    if(!$('githubview')||root!==$('githubview'))return;
    status.textContent='GitHub is unavailable: '+err.message+'. You can open the repository directly.';
    const retry=document.createElement('button');retry.textContent='Retry';retry.onclick=()=>githubTab(tab,path);root.append(retry);
  }
}

function renderStreaming(){let sel=$('streamregion');if(!sel)return;let region=sel.value==='auto'?(navigator.language||'').toLowerCase().endsWith('-il')?'IL':'other':sel.value;let items=[['Netflix','https://www.netflix.com/'],['Disney+','https://www.disneyplus.com/'],['Apple TV','https://tv.apple.com/'],['YouTube','https://www.youtube.com/'],['Prime Video','https://www.primevideo.com/']];if(region==='IL')items.push(['Kan BOX','https://www.kan.org.il/'],['yes','https://www.yes.co.il/'],['HOT','https://www.hot.net.il/']);if(region==='US')items.push(['Hulu','https://www.hulu.com/'],['Peacock','https://www.peacocktv.com/']);let root=$('streamlinks');root.replaceChildren();for(let [name,url] of items){let a=document.createElement('a');a.textContent=name;a.href=url;a.target='_blank';a.rel='noopener noreferrer';root.append(a)}}launch=function(id){
if(!extraLabels[id])return baseLaunch(id);

case 'games':appShell(id,'<h2>Loading ItamarOS Games…</h2>');if(window.ItamarGames)window.ItamarGames.mount();else $('content').textContent='Games module is unavailable. Reload to retry.';break;
case 'github':appShell(id,'<h2>🐙 GitHub · ItamarOS</h2><p>Official project repository, source files and published installation releases.</p><div class="github-toolbar"><a href="https://github.com/itamarnintendo04-arch/ItamarOS" target="_blank" rel="noopener noreferrer">Open repository</a><a href="/downloads.html" target="_blank" rel="noopener noreferrer">Downloads page</a><button onclick="githubTab(\'files\')">Browse files</button><button onclick="githubTab(\'releases\')">Installer releases</button></div><p class="note">Native OS installation files have not been published yet. The browser demo and setup demonstration are not operating-system installers.</p><div id="githubview" aria-live="polite"></div>');githubTab('files');break;
case 'streaming':appShell(id,'<h2>Streaming services</h2><p>Select your country or region. Availability depends on the service, device and subscription.</p><select id="streamregion" onchange="renderStreaming()"><option value="auto">Auto (browser language)</option><option value="IL">Israel</option><option value="US">United States</option><option value="other">Other</option></select><div id="streamlinks"></div><p class="note">Links open official websites. Some services require their official app or DRM support. This is not an app installer.</p>');renderStreaming();break;
case 'weather':appShell(id,'<h2>Weather</h2><p>Live forecasts require a weather data provider. This preview does not guess conditions.</p><p><a href="https://www.weather.gov/" target="_blank" rel="noopener noreferrer">Weather information</a></p>');break;
case 'contacts':appShell(id,'<h2>Contacts</h2><input id="name" placeholder="Name"><input id="info" placeholder="Email or note"><div class="toolrow"><button onclick="addContact()">Add contact</button></div><div id="items"></div>');renderContacts();break;
case 'journal':appShell(id,'<h2>Journal</h2><p>Private to this browser profile</p><textarea id="savedtext" oninput="savedText(\'journal\')" placeholder="Write about your day..."></textarea>');$('savedtext').value=getStore('journal','');break;
case 'converter':appShell(id,'<h2>Unit converter</h2><input type="number" id="unitval" value="1"><select id="unit"><option value="km_mi">Kilometers → Miles</option><option value="mi_km">Miles → Kilometers</option><option value="kg_lb">Kilograms → Pounds</option><option value="lb_kg">Pounds → Kilograms</option><option value="cm_in">Centimeters → Inches</option><option value="in_cm">Inches → Centimeters</option></select><button onclick="convertUnits()">Convert</button><p class="big" id="conversion"></p>');convertUnits();break;
case 'passwords':appShell(id,'<h2>Random password generator</h2><p>Generates a password on your device. Not a password vault.</p><input id="password" readonly><button onclick="generatePassword()">Generate</button>');generatePassword();break;
case 'timer':appShell(id,'<h2>Countdown</h2><input type="number" id="seconds" min="1" max="86400" value="60"><div class="toolrow"><button onclick="startTimer()">Start (seconds)</button><button onclick="clearInterval(countdown);countdown=null">Stop</button></div><p class="big" id="countdown">1:00</p>');break;

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ItamarOS Web Emulator</title><style>
:root{font-family:system-ui;color:#f5f8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#366ba5,#0a1932 65%,#070c19);height:100vh;overflow:hidden}header{padding:20px}header h1{margin:0;font-size:25px}header small{color:#b8d4f4}.desktop{display:grid;grid-template-columns:repeat(2,100px);gap:16px;padding:25px}.app{border:0;background:#ffffff16;color:white;padding:15px 5px;border-radius:15px;cursor:pointer}.app:hover{background:#ffffff35}.app span{display:block;font-size:30px;margin-bottom:7px}.taskbar{position:absolute;bottom:0;background:#101c33dd;width:100%;padding:12px;display:flex;gap:10px;align-items:center;backdrop-filter:blur(15px)}button{cursor:pointer}.taskbar button,.window button{border:0;border-radius:8px;padding:8px;background:#34517b;color:white}.window{position:absolute;top:15%;left:20%;width:min(580px,78vw);min-height:240px;border:1px solid #7698c2;background:#132541;border-radius:14px;box-shadow:0 20px 80px #0008;overflow:hidden}.bar{padding:12px;background:#29456a;display:flex;justify-content:space-between}.content{padding:20px}.content textarea{width:100%;height:180px;background:#07172c;color:white;border:1px solid #789;padding:12px}.content input{width:100%;padding:10px;border-radius:8px}.content pre{white-space:pre-wrap}.hidden{display:none}.note{color:#b4c6dc;font-size:12px}.content button{margin:4px}.app{min-height:90px}.desktop{grid-template-columns:repeat(auto-fill,100px);max-width:900px}.window{max-height:72vh;overflow:auto}.content iframe{width:100%;height:45vh;border:0;background:white;border-radius:8px}.content .tile{display:inline-block;padding:10px;margin:5px;background:#29466b;border-radius:10px} </style>
<header><h1>◈ ItamarOS</h1><small>Web Emulator · Limited preview · Local storage</small></header><main class="desktop"><button class="app" onclick="launch('files')"><span>📁</span>Files</button><button class="app" onclick="launch('terminal')"><span>⌨️</span>Terminal</button><button class="app" onclick="launch('notes')"><span>📝</span>Notepad</button><button class="app" onclick="launch('calculator')"><span>🧮</span>Calculator</button><button class="app" onclick="launch('browser')"><span>🌐</span>Browser</button><button class="app" onclick="launch('settings')"><span>⚙️</span>Settings</button><button class="app" onclick="launch('store')"><span>🛍️</span>Store</button><button class="app" onclick="launch('calendar')"><span>📅</span>Calendar</button><button class="app" onclick="launch('clock')"><span>🕒</span>Clock</button><button class="app" onclick="launch('paint')"><span>🎨</span>Paint</button><button class="app" onclick="launch('photos')"><span>🖼️</span>Photos</button><button class="app" onclick="launch('music')"><span>🎵</span>Music</button><button class="app" onclick="launch('video')"><span>🎬</span>Videos</button><button class="app" onclick="launch('tasks')"><span>☑️</span>Tasks</button><button class="app" onclick="launch('system')"><span>📊</span>System</button><button class="app" onclick="launch('help')"><span>❔</span>Help</button></main><section id="window" class="window hidden"><div class="bar"><b id="title"></b><button onclick="closeWindow()">✕</button></div><div id="content" class="content"></div></section><nav class="taskbar"><button onclick="launch('welcome')">◈ Start</button><span id="clock"></span><span style="margin-left:auto">ItamarOS 0.2 · Browser preview</span></nav><script>
const $=id=>document.getElementById(id);const state=JSON.parse(localStorage.getItem('itamaros-data')||'{"files":{"Welcome.txt":"Welcome to ItamarOS!"},"note":""}');function save(){localStorage.setItem('itamaros-data',JSON.stringify(state))}function closeWindow(){$('window').classList.add('hidden')}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function launch(app){$('window').classList.remove('hidden');$('title').textContent=app[0].toUpperCase()+app.slice(1);let c=$('content');if(app==='notes'){c.innerHTML='<textarea id="note" placeholder="Write here..."></textarea><p class="note">Autosaved locally</p>';$('note').value=state.note;$('note').oninput=e=>{state.note=e.target.value;save()}}else if(app==='files'){c.innerHTML='<button onclick="newFile()">+ New file</button><div id="listing"></div>';files()}else if(app==='terminal'){c.innerHTML='<pre>ItamarOS Web Terminal (simulation)\nCommands: help, date, ls, clear, echo TEXT</pre><input id="cmd" placeholder="Enter command">';$('cmd').onkeydown=e=>{if(e.key==='Enter'){let cmd=e.target.value;let out=cmd==='help'?'help, date, ls, clear, echo TEXT':cmd==='date'?new Date().toString():cmd==='ls'?Object.keys(state.files).join('\n'):cmd.startsWith('echo ')?cmd.slice(5):cmd==='clear'?'':'Command not available in web preview';c.querySelector('pre').textContent=cmd==='clear'?'':c.querySelector('pre').textContent+'\n> '+cmd+'\n'+out;e.target.value=''}}}else if(app==='calculator'){c.innerHTML='<input id="expr" placeholder="Example: 12 * (4 + 2)"><button id="calc">Calculate</button><pre id="result"></pre>';$('calc').onclick=()=>{let e=$('expr').value;$('result').textContent=/^[0-9+*/(). % -]+$/.test(e)?calc(e):'Invalid expression'}}else if(app==='browser'){c.innerHTML='<p>Open websites in your real browser:</p><input id="url" placeholder="https://example.com"><button onclick="openSite()">Open</button><p class="note">External sites open in a separate browser tab.</p>'}else if(app==='store'){c.innerHTML='<h3>Itamar Store</h3><p>Preview only. Real app installation is available in the future Linux desktop build.</p>'}else if(app==='calendar'){let d=new Date();c.innerHTML='<h3>'+d.toLocaleDateString('en',{month:'long',year:'numeric'})+'</h3><p>'+d.toDateString()+'</p><input type="date">' }else if(app==='clock'){c.innerHTML='<h2 id="time"></h2><p>Local time on your device</p>';function tick(){if($('time'))$('time').textContent=new Date().toLocaleString()}tick();setInterval(tick,1000)}else if(app==='tasks'){c.innerHTML='<h3>Tasks</h3><input id="task" placeholder="New task"><button onclick="addTask()">Add</button><div id="tasklist"></div>';renderTasks()}else if(app==='paint'){c.innerHTML='<h3>Paint</h3><input type="color" id="color" value="#ffffff"><button onclick="paintClear()">Clear</button><button onclick="paintSave()">Save PNG</button><canvas id="canvas" width="450" height="260" style="width:100%;background:white;touch-action:none"></canvas>';initPaint()}else if(app==='photos'){c.innerHTML='<h3>Photos</h3><input type="file" accept="image/*" id="photo"><div id="preview"></div>';$('photo').onchange=e=>{let file=e.target.files[0];if(file){let url=URL.createObjectURL(file);$('preview').innerHTML='<img alt="Selected photo" style="max-width:100%" src="'+url+'">'}}}else if(app==='music'||app==='video'){c.innerHTML='<h3>Local '+app+'</h3><input type="file" id="media" accept="'+(app==='music'?'audio/*':'video/*')+'"><div id="player"></div>';$('media').onchange=e=>{let f=e.target.files[0];if(f){let media=document.createElement(app==='music'?'audio':'video');media.controls=true;media.style.maxWidth='100%';media.src=URL.createObjectURL(f);$('player').replaceChildren(media)}}}else if(app==='system'){c.innerHTML='<h3>System Monitor</h3><p>Browser simulation, not physical OS</p><p>CPU and RAM metrics are not accessible in this preview.</p><p>Stored files: '+Object.keys(state.files).length+'</p>'}else if(app==='help'){c.innerHTML='<h3>ItamarOS Help</h3><p>This is a limited web emulator. Notes, tasks and virtual files persist locally. WebView desktop integration is planned.</p>'}else if(app==='settings'){c.innerHTML='<h3>System</h3><p>ItamarOS Web Emulator 0.2</p><p>Data saved in this browser using localStorage.</p><button onclick="if(confirm(\'Delete browser emulator data?\')){localStorage.removeItem(\'itamaros-data\');location.reload()}">Reset local data</button>'}else{c.innerHTML='<h3>Welcome to ItamarOS!</h3><p>This is a limited browser demo, not a full operating system. Your notes and virtual files persist in this browser.</p>'}}function renderTasks(){let tasks=state.tasks||[];$('tasklist').innerHTML=tasks.map((t,i)=>'<p><button onclick="removeTask('+i+')">✓</button> '+esc(t)+'</p>').join('')}function addTask(){let t=$('task').value.trim();if(t){(state.tasks??=[]).push(t);save();renderTasks();$('task').value=''}}function removeTask(i){state.tasks.splice(i,1);save();renderTasks()}let ctx,painting=false;function initPaint(){let canvas=$('canvas');ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);function pos(e){let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}canvas.onpointerdown=e=>{painting=true;canvas.setPointerCapture(e.pointerId);let [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)};canvas.onpointermove=e=>{if(!painting)return;let [x,y]=pos(e);ctx.strokeStyle=$('color').value;ctx.lineWidth=3;ctx.lineTo(x,y);ctx.stroke()};canvas.onpointerup=()=>painting=false}function paintClear(){ctx.fillStyle='white';ctx.fillRect(0,0,450,260)}function paintSave(){let a=document.createElement('a');a.href=$('canvas').toDataURL();a.download='itamaros-paint.png';a.click()}function calc(x){try{return Function('return ('+x+')')()}catch{return 'Error'}}function openSite(){let x=$('url').value.trim();if(!/^https?:\/\//i.test(x))x='https://'+x;window.open(x,'_blank','noopener,noreferrer')}function files(){$('listing').innerHTML=Object.entries(state.files).map(([k,v])=>'<p><button data-name="'+esc(k)+'">📄 '+esc(k)+'</button></p>').join('');$('listing').querySelectorAll('button').forEach(b=>b.onclick=()=>{let name=b.dataset.name;let value=prompt('Edit '+name,state.files[name]);if(value!==null){state.files[name]=value;save()}})}function newFile(){let n=prompt('File name');if(n&&!Object.hasOwn(state.files,n)){state.files[n]='';save();files()}}setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString(),1000);launch('welcome');
</script></html>

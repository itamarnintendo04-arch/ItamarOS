name: Build ItamarOS Windows Demo
on:
  pull_request:
    branches: [main]
    paths: ['desktop-app/**', '.github/workflows/desktop-demo.yml']
  push:
    branches: [main]
    paths: ['desktop-app/**', '.github/workflows/desktop-demo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-demo:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Electron dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Validate app script
        shell: pwsh
        run: node --check main.js
      - name: Build portable Windows emulator
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build
      - name: Compute SHA-256 for review (does not prove safety)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path ./dist -Filter *.exe
          if (-not $files) { throw "No test EXE produced" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path ./dist/SHA256SUMS.txt -Encoding Ascii
          Get-Content ./dist/SHA256SUMS.txt
      - name: Upload unverified test artifacts (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: ItamarOS-UNVERIFIED-Windows-test
          path: |
            desktop-app/dist/*.exe
            desktop-app/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

name: Build standalone ItamarOS Connect EXE and DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-connect/**'
      - '.github/workflows/connect-desktop.yml'

permissions:
  contents: read

concurrency:
  group: itamaros-connect-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            output: windows-exe
            command: build:win
          - os: macos-15
            output: macos-dmg
            command: build:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        working-directory: desktop-connect
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax validation
        working-directory: desktop-connect
        run: npm run check
      - name: Package standalone installer (unsigned developer preview)
        working-directory: desktop-connect
        run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ItamarOS-Connect-${{ matrix.output }}
          path: |
            desktop-connect/dist/*.exe
            desktop-connect/dist/*.dmg
          retention-days: 30
          if-no-files-found: error

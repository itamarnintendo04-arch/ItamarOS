name: Publish ItamarOS Installer preview builds
on:
  workflow_run:
    workflows:
      - Build ItamarOS Installer (Windows)
      - Build ItamarOS Installer Mobile IPA
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Select installer edition
        id: edition
        env:
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$WORKFLOW" == "Build ItamarOS Installer (Windows)" ]]; then
            echo "name=ItamarOS Installer Windows" >> "$GITHUB_OUTPUT"
            echo "artifact=ItamarOS-Installer-Windows-EXE" >> "$GITHUB_OUTPUT"
            echo "file=ItamarOS Installer.exe" >> "$GITHUB_OUTPUT"
            echo "tag=installer-windows-preview-$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "notes=Windows EXE preview. Certificate metadata stays on the computer. Automatic IPA re-signing is not implemented. Requires a valid already-signed IPA for installation." >> "$GITHUB_OUTPUT"
          elif [[ "$WORKFLOW" == "Build ItamarOS Installer Mobile IPA" ]]; then
            echo "name=ItamarOS Installer Mobile" >> "$GITHUB_OUTPUT"
            echo "artifact=ItamarOS-Installer-Mobile-Unsigned-IPA" >> "$GITHUB_OUTPUT"
            echo "file=ItamarOSInstallerMobile-unsigned.ipa" >> "$GITHUB_OUTPUT"
            echo "tag=installer-ios-preview-$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "notes=Unsigned developer IPA preview. Requires authorized signing and matching provisioning before installation. Certificates and private keys stay on the paired computer." >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported workflow" >&2
            exit 1
          fi
      - name: Download verified build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT: ${{ steps.edition.outputs.artifact }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GH_REPO" --name "$ARTIFACT" --dir dist
      - name: Check file exists and record checksum
        env:
          FILENAME: ${{ steps.edition.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/$FILENAME"
          (cd dist && sha256sum "$FILENAME" > SHA256SUMS.txt)
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.edition.outputs.tag }}
          RELEASE_NAME: ${{ steps.edition.outputs.name }}
          RELEASE_NOTES: ${{ steps.edition.outputs.notes }}
          RELEASE_SHA: ${{ steps.edition.outputs.sha }}
          RELEASE_FILE: ${{ steps.edition.outputs.file }}
        run: |
          set -euo pipefail
          printf '%s\n\nSource commit: %s\nBuild passed its configured GitHub Actions checks. Hardware installation has not been verified.\n' "$RELEASE_NOTES" "$RELEASE_SHA" > notes.txt
          gh release create "$RELEASE_TAG" "dist/$RELEASE_FILE" dist/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$RELEASE_SHA" \
            --title "$RELEASE_NAME (preview, run ${{ github.event.workflow_run.run_number }})" \
            --notes-file notes.txt --prerelease

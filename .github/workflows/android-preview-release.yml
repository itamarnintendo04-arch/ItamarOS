name: Publish Android 1.1 Preview APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-preview-release.yml'
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build native APK for Android and Android TV
        working-directory: native-apps/android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK packaging and generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          source='native-apps/android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$source"
          mkdir -p dist
          cp "$source" dist/ItamarOS-Android-1.1.0-debug.apk
          sha256sum dist/ItamarOS-Android-1.1.0-debug.apk > dist/SHA256SUMS-Android.txt
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose dist/ItamarOS-Android-1.1.0-debug.apk
          unzip -t dist/ItamarOS-Android-1.1.0-debug.apk > /dev/null
          cat dist/SHA256SUMS-Android.txt
      - name: Verify Android package identity
        shell: bash
        run: |
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging dist/ItamarOS-Android-1.1.0-debug.apk | grep "package: name='org.itamaros.nativeapp'"
      - name: Describe prerelease safety limits
        run: |
          cat > dist/RELEASE_NOTES.txt <<'NOTES'
          # ItamarOS 1.1 — Android / Android TV native preview

          This is a real native Kotlin/Jetpack Compose Android application, not a WebView.
          Android phone/tablet and Android TV share this APK; its UI detects the device at runtime.
          Android 8.0+ is the stated minimum, subject to actual device and TV compatibility.

          **UNVERIFIED DEVELOPMENT BUILD — NOT A PRODUCTION OR STORE RELEASE.**
          This APK is debug-signed by CI, not signed with a trusted production publisher key.
          APK signature, successful compile and SHA-256 do not prove it is free of malware.
          The file has not completed independent antivirus, device safety or release QA.
          Use only on a spare test device where allowed. Never ignore a security warning,
          disable Play Protect/antivirus or bypass a manufacturer's installation restrictions.

          This is an application, NOT an installer to replace Android or Android TV.
          Use the SHA256SUMS-Android.txt file to compare the downloaded file to this build.
          NOTES
      - name: Publish dedicated prerelease for direct Downloader access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v1.1-android-preview'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'A preview release already exists; refusing to overwrite test APK.'
            exit 1
          fi
          gh release create "$tag" \
            dist/ItamarOS-Android-1.1.0-debug.apk \
            dist/SHA256SUMS-Android.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'ItamarOS Android 1.1 — UNVERIFIED Native Preview' \
            --notes-file dist/RELEASE_NOTES.txt

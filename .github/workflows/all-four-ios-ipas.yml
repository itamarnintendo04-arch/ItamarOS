name: Build seven ItamarOS unsigned iOS IPAs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native-apps/apple/**"
      - ".github/workflows/all-four-ios-ipas.yml"
concurrency:
  group: seven-ios-ipas
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  seven-ipas:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          brew install xcodegen librsvg
          python3 -m pip install --break-system-packages pillow
      - name: Generate Cloud Climb artwork and font
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages fonttools
          python3 native-apps/apple/CloudClimb/generate_font.py
          ICON_DIR="native-apps/apple/CloudClimb/Assets.xcassets/CloudClimbAppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          rsvg-convert --format=png --width=1024 --height=1024 assets/branding/cloud-climb-icon.svg > "$ICON_DIR/Icon.png"
      - name: Generate unique app icons
        run: python3 native-apps/apple/generate_app_icons.py
      - name: Generate Xcode project
        working-directory: native-apps/apple
        run: xcodegen generate
      - name: Compile seven apps
        working-directory: native-apps/apple
        run: |
          set -euo pipefail
          for scheme in ItamarOSiOS ItamarOSGamesiOS CloudClimbiOS SkyboundIslesiOS VoiceRecorderiOS ItamarCutiOS ScreenBalanceiOS; do
            xcodebuild -project ItamarOSNative.xcodeproj -scheme "$scheme" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Build-$scheme" CODE_SIGNING_ALLOWED=NO build
          done
      - name: Package all seven unsigned IPAs
        run: |
          set -euo pipefail
          mkdir -p output
          for scheme in ItamarOSiOS ItamarOSGamesiOS CloudClimbiOS SkyboundIslesiOS VoiceRecorderiOS ItamarCutiOS ScreenBalanceiOS; do
            APP="$RUNNER_TEMP/Build-$scheme/Build/Products/Release-iphoneos/$scheme.app"
            test -d "$APP"
            mkdir -p "$RUNNER_TEMP/ipa-$scheme/Payload"
            cp -R "$APP" "$RUNNER_TEMP/ipa-$scheme/Payload/"
            (cd "$RUNNER_TEMP/ipa-$scheme" && zip -qry "$GITHUB_WORKSPACE/output/$scheme-UNSIGNED.ipa" Payload)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: All-Seven-ItamarOS-iOS-UNSIGNED-IPAs
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 90

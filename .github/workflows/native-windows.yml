name: Validate Native Windows WPF
on:
  push:
    branches: [main, updates]
    paths:
      - 'native-apps/windows/**'
      - '.github/workflows/native-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native-apps/windows/**'
      - '.github/workflows/native-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wpf-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile native WPF source
        shell: pwsh
        run: dotnet build native-apps/windows/ItamarOS.Native.Windows.csproj -c Debug
      - name: Security notice
        shell: pwsh
        run: Write-Host "Compile test only. No EXE is published because the earlier unsigned EXE Avast detection remains under investigation."

name: Create and commit real iOS app icons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render 1024px illustrated icons
        run: python3 native-apps/apple/generate_app_icons.py
      - name: Commit generated PNG icons to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-apps/apple/ItamarOSGames/Assets.xcassets/GamesIcon.appiconset/ native-apps/apple/SkyboundIsles/Assets.xcassets/SkyboundIcon.appiconset/ native-apps/apple/VoiceRecorder/Assets.xcassets/VoiceRecorderIcon.appiconset/ native-apps/apple/CloudClimb/Assets.xcassets/CloudClimbAppIcon.appiconset/
          if git diff --cached --quiet; then
            echo "Icons already committed"
          else
            git commit -m "Add rendered 1024px icons for four iOS apps"
            git push
          fi

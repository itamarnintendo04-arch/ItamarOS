name: Build ItamarOS Offline Desktop Demo
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['desktop/**', 'apps/**', 'index.html', '.github/workflows/desktop-offline.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare locally bundled emulator files
        run: node prepare.cjs
      - name: Validate source
        run: node --check main.cjs
      - name: Build Windows portable demo
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable --publish never
      - name: Build Linux AppImage demo
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish never
      - name: Upload unsigned test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ItamarOS-Offline-Demo-${{ matrix.os }}
          path: desktop/build/*
          if-no-files-found: error
          retention-days: 14

name: Validate Native Apple
on:
  push:
    branches: [main, updates]
    paths:
      - 'native-apps/apple/**'
      - '.github/workflows/native-apple.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native-apps/apple/**'
      - '.github/workflows/native-apple.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apple-project-check:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native SwiftUI project for Apple platforms
        working-directory: native-apps/apple
        run: xcodegen generate
      - name: List targets
        working-directory: native-apps/apple
        run: xcodebuild -list -project ItamarOSNative.xcodeproj
      - name: Compile native iPhone/iPad app (unsigned simulator)
        working-directory: native-apps/apple
        run: |
          xcodebuild -project ItamarOSNative.xcodeproj -scheme ItamarOSiOS -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Compile native Mac app (unsigned)
        working-directory: native-apps/apple
        run: |
          xcodebuild -project ItamarOSNative.xcodeproj -scheme ItamarOSmacOS -configuration Debug -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Compile native Apple TV app (unsigned simulator)
        working-directory: native-apps/apple
        run: |
          xcodebuild -project ItamarOSNative.xcodeproj -scheme ItamarOStvOS -configuration Debug -sdk appletvsimulator -destination 'generic/platform=tvOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned physical-device iOS app for developer signing
        working-directory: native-apps/apple
        run: |
          xcodebuild -project ItamarOSNative.xcodeproj -scheme ItamarOSiOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/DeviceBuild" CODE_SIGNING_ALLOWED=NO build
      - name: Package iPhone/iPad IPA for developer signing tools
        working-directory: native-apps/apple
        shell: bash
        run: |
          set -euo pipefail
          APP="DeviceBuild/Build/Products/Release-iphoneos/ItamarOSiOS.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          mkdir -p unsigned/Payload
          ditto "$APP" unsigned/Payload/ItamarOSiOS.app
          (cd unsigned && /usr/bin/zip -qry "../ItamarOS-1.6.0-iOS-UNSIGNED.ipa" Payload)
          unzip -t "ItamarOS-1.6.0-iOS-UNSIGNED.ipa" >/dev/null
          shasum -a 256 "ItamarOS-1.6.0-iOS-UNSIGNED.ipa" > "SHA256SUMS-iOS.txt"
          echo "This unsigned development IPA requires legitimate developer signing/provisioning before iPhone installation." > UNSIGNED-READ-ME.txt
      - name: Upload development IPA as downloadable GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ItamarOS-1.6.0-iPhone-iPad-UNSIGNED-IPA
          path: |
            native-apps/apple/ItamarOS-1.6.0-iOS-UNSIGNED.ipa
            native-apps/apple/SHA256SUMS-iOS.txt
            native-apps/apple/UNSIGNED-READ-ME.txt
          if-no-files-found: error
          retention-days: 14

  publish-personal-signing-preview:
    name: Publish iOS unsigned IPA and AltStore source
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: apple-project-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ItamarOS-1.6.0-iPhone-iPad-UNSIGNED-IPA
          path: dist
      - name: Verify the real iOS archive and build AltStore Classic source metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, pathlib, plistlib, zipfile
          root = pathlib.Path("dist")
          ipa = root / "ItamarOS-1.6.0-iOS-UNSIGNED.ipa"
          assert ipa.is_file() and ipa.stat().st_size > 0, "Actual iOS archive missing"
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None, "IPA is corrupt"
              info = plistlib.loads(archive.read("Payload/ItamarOSiOS.app/Info.plist"))
          version = info["CFBundleShortVersionString"]
          bundle = info["CFBundleIdentifier"]
          assert version == "1.6.0" and bundle == "org.itamaros.mobile", "Unexpected identity or version"
          repo = "itamarnintendo04-arch/ItamarOS"
          tag = "v1.6-ios-unsigned"
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          icon = f"https://raw.githubusercontent.com/{repo}/main/assets/branding/itamaros-mark-512.png"
          source = {
              "name": "ItamarOS Developer Preview",
              "identifier": "org.itamaros.unsigned.preview",
              "subtitle": "Personal-signing development IPA",
              "sourceURL": base + "altstore-source.json",
              "iconURL": icon,
              "website": f"https://github.com/{repo}",
              "apps": [{
                  "name": "ItamarOS",
                  "bundleIdentifier": bundle,
                  "developerName": "ItamarOS",
                  "subtitle": "Native games, media and files",
                  "localizedDescription": "Developer-built unsigned IPA. Requires a compatible local signing tool, valid personal Apple developer provisioning and device approval. ItamarOS does not store Apple passwords.",
                  "iconURL": icon,
                  "category": "utilities",
              "appPermissions": {
                  "entitlements": ["com.apple.developer.applesignin"],
                  "privacy": {k: v for k, v in info.items() if k.startswith("NS") and k.endswith("UsageDescription") and isinstance(v, str)}
              },
                  "versions": [{
                      "version": version,
                      "buildVersion": str(info["CFBundleVersion"]),
                      "date": datetime.datetime.now(datetime.timezone.utc).date().isoformat(),
                      "downloadURL": base + ipa.name,
                      "size": ipa.stat().st_size,
                      "minOSVersion": str(info.get("MinimumOSVersion", "17.0")),
                  }]
              }],
              "news": [],
          }
          (root / "altstore-source.json").write_text(json.dumps(source, indent=2) + "\n")
          print("Prepared public unsigned IPA metadata for", bundle, version)
          PY
      - name: Publish public, explicitly unsigned iOS developer prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: itamarnintendo04-arch/ItamarOS
        shell: bash
        run: |
          set -euo pipefail
          tag='v1.6-ios-unsigned'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists. Refusing to overwrite an existing IPA.'
            exit 1
          fi
          gh release create "$tag" \
            dist/ItamarOS-1.6.0-iOS-UNSIGNED.ipa \
            dist/SHA256SUMS-iOS.txt \
            dist/UNSIGNED-READ-ME.txt \
            dist/altstore-source.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'ItamarOS iOS 1.6 — UNSIGNED PERSONAL-SIGNING PREVIEW' \
            --notes 'This is an unsigned developer IPA for the user to sign with their own Apple-issued identity. It does not install on its own. No Apple passwords or device data are collected by ItamarOS. Sign-in with Apple is unrelated to code signing. Use only valid device provisioning; never bypass security warnings.'

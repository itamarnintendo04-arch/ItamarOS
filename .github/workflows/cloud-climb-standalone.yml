name: Build standalone Cloud Climb Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-apps/android/**'
      - '.github/workflows/cloud-climb-standalone.yml'
permissions:
  contents: read
jobs:
  cloud-climb-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build independent Cloud Climb debug APK
        working-directory: native-apps/android
        run: gradle :cloudclimb:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature, package name and archive
        run: |
          APK='native-apps/android/cloudclimb/build/outputs/apk/debug/cloudclimb-debug.apk'
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='org.itamaros.cloudclimb'"
          unzip -t "$APK" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: CloudClimb-Android-standalone-UNVERIFIED-debug
          path: native-apps/android/cloudclimb/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

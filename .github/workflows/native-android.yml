name: Validate Native Android
on:
  push:
    branches: [main, updates]
    paths:
      - 'native-apps/android/**'
      - '.github/workflows/native-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native-apps/android/**'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform with existing hosted SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile Android phone/tablet and TV native APK (unverified debug only)
        working-directory: native-apps/android
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ItamarOS-UNVERIFIED-Android-debug
          path: native-apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Itamio — ItamarOS</title><style>
:root{font-family:system-ui;background:#0c2040;color:#f5f8ff}body{margin:0;padding:22px;max-width:850px;margin:auto}a{color:#b2d5ff}
section{padding:18px;background:#183454;border-radius:18px}input{padding:12px;border-radius:9px;max-width:100%;min-width:230px;border:0}
button{padding:12px;border-radius:9px;border:0;cursor:pointer;background:#9ac0ef;color:#092447}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}h1{margin:9px 0}p{color:#d0e2fc;line-height:1.6}
</style></head><body>
<h1>▶ Itamio</h1>
<p>Watch or find videos on YouTube using its official website. This app is not affiliated with YouTube. It does not download videos or bypass restrictions.</p>
<section>
<label for="video">YouTube video URL</label>
<div class="row"><input id="video" placeholder="https://www.youtube.com/watch?v=..." type="url"><button id="open">Open on YouTube</button></div>
<label for="search">Search YouTube</label>
<div class="row"><input id="search" placeholder="Find a video"><button id="find">Search</button></div>
<p id="error"></p>
<p>ItamarOS native edition opens videos in your default browser to ensure the official player and protections work correctly.</p>
</section>
<script>
function parseId(value){try{const u=new URL(value.trim()),host=u.hostname.replace(/^www\./,'');let id='';
if(host==='youtu.be')id=u.pathname.slice(1).split('/')[0];
else if(['youtube.com','m.youtube.com','music.youtube.com'].includes(host)){if(u.pathname==='/watch')id=u.searchParams.get('v')||'';else if(u.pathname.startsWith('/shorts/')||u.pathname.startsWith('/live/'))id=u.pathname.split('/')[2]||''}
return /^[a-z0-9_-]{11}$/i.test(id)?id:null}catch{return null}}
document.getElementById('open').onclick=()=>{const id=parseId(document.getElementById('video').value);if(!id){document.getElementById('error').textContent='Enter a valid YouTube video URL.';return}window.open('https://www.youtube.com/watch?v='+id,'_blank')};
document.getElementById('find').onclick=()=>{const q=document.getElementById('search').value.trim();if(q)window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank')};
</script></body></html>

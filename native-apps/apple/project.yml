name: ItamarOSNative
options:
  bundleIdPrefix: org.itamaros
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.9"
targets:
  CloudClimbiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
        excludes:
          - Localizations/**
          - ItamarOSApp.swift
      - path: CloudClimb/CloudClimbStandaloneApp.swift
      - path: CloudClimb/Assets.xcassets
      - path: CloudClimb/Fonts
      - path: iOS/Assets.xcassets
    info:
      path: CloudClimb/Info.plist
      properties:
        CFBundleDisplayName: Cloud Climb
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: org.itamaros.cloudclimb
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - cloudclimb
        NSCameraUsageDescription: "Scan Cloud Climb and ItamarOS login QR codes to review and approve sign-in requests."
        NSFaceIDUsageDescription: "Confirm it is you before approving a Cloud Climb account login."
        UIAppFonts:
          - Fredoka.ttf
        ITAMAR_SUPABASE_URL: "https://slqjkysinhfkqjoigfuz.supabase.co"
        ITAMAR_SUPABASE_PUBLISHABLE_KEY: "sb_publishable__WVo13dRVkDYChuGxHxk9A_CDoVR9ts"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.itamaros.cloudclimb
        ASSETCATALOG_COMPILER_APPICON_NAME: CloudClimbAppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cloud Climb
        TARGETED_DEVICE_FAMILY: "1,2"
  ItamarOSiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
        excludes:
          - Localizations/**
      - path: iOS/Assets.xcassets
    info:
      path: iOS/Info.plist
      properties:
        NSCameraUsageDescription: "Scan QR codes to securely connect your ItamarOS account to another device."
        NSFaceIDUsageDescription: "Confirm it is you before approving sign-in on another ItamarOS device."
        NSContactsUsageDescription: "Contacts are used only when you explicitly choose names for private local message drafts. They are never uploaded."
        NSMicrophoneUsageDescription: "Record a voice message only when you explicitly tap Record in ItamarOS Connect."
        ITAMAR_SUPABASE_URL: "https://slqjkysinhfkqjoigfuz.supabase.co"
        ITAMAR_SUPABASE_PUBLISHABLE_KEY: "sb_publishable__WVo13dRVkDYChuGxHxk9A_CDoVR9ts"
        CFBundleURLTypes:
          - CFBundleURLName: org.itamaros.mobile
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - itamaros
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.itamaros.mobile
        CODE_SIGN_ENTITLEMENTS: iOS/ItamarOS.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ItamarOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  ItamarOStvOS:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
        excludes:
          - Localizations/**
        excludes:
          - Localizations/**
          - NativeGameView.swift
          - ExtraMobileGames.swift
          - GameArtworkView.swift
      - path: tvOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.itamaros.tv
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ItamarOS TV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "3"
  ItamarOSmacOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shared
        excludes:
          - Localizations/**
      - path: macOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.itamaros.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ItamarOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ItamarOSvisionOS:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: Shared
        excludes:
          - Localizations/**
      - path: visionOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.itamaros.vision
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ItamarOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ItamarOSwatchOS:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      - path: watchOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.itamaros.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ItamarOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

name: ItamarOSNative
options:
  bundleIdPrefix: org.itamaros
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.9"
targets:
  ItamarOSiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: iOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.itamaros.mobile
        CODE_SIGN_ENTITLEMENTS: iOS/ItamarOS.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ItamarOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  ItamarOStvOS:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
        excludes:
          - NativeGameView.swift
          - ExtraMobileGames.swift
          - GameArtworkView.swift
      - path: tvOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.itamaros.tv
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ItamarOS TV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "3"
  ItamarOSmacOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shared
      - path: macOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.itamaros.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ItamarOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ItamarOSvisionOS:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: Shared
      - path: visionOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.itamaros.vision
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ItamarOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ItamarOSwatchOS:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      - path: watchOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.itamaros.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ItamarOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

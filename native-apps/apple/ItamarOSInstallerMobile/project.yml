name: ItamarOSInstallerMobile
options:
  bundleIdPrefix: net.itamaros
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.6.0'
    CURRENT_PROJECT_VERSION: '7'
    CODE_SIGNING_ALLOWED: NO
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  ItamarOSInstaller:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: App.swift
      - path: WiFiCompanion.swift
      - path: ChangeAppIconView.swift
      - path: CertificateVault.swift
      - path: Catalog.swift
      - path: StoreSources.swift
      - path: Storefront.swift
      - path: SourceQRScanner.swift
      - path: CustomIPA.swift
      - path: ComputerInstallView.swift
      - path: EmbeddedIPASignerView.swift
      - path: Assets.xcassets
    dependencies:
      - package: ZIPFoundation
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ItamarOS Installer
        CFBundleShortVersionString: '1.6.0'
        CFBundleVersion: '7'
        UILaunchScreen: {}
        NSCameraUsageDescription: Scan the pairing QR shown by your trusted ItamarOS Installer on Windows.
        NSLocalNetworkUsageDescription: Find and securely connect to your ItamarOS Installer computer on the same Wi-Fi network.
        NSBonjourServices:
          - _itamaros._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.itamaros.installer.mobile
        PRODUCT_NAME: ItamarOSInstaller
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "ItamarIconBlue ItamarIconGreen ItamarIconPurple ItamarIconPink ItamarIconOrange ItamarIconRed"
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
